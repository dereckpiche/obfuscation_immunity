# @package _global_
# Qwen3.5's chat: thinking on, closed by </think>, the reply after a blank
# line, a turn ended by <|im_end|> (common.chat_format).
chat:
  think_close: </think>
  separator: "\n\n"
  end_of_turn: <|im_end|>

data:
  apply_chat_template_kwargs:
    enable_thinking: true         # its small models think only if asked

actor_rollout_ref:
  model:
    exclude_modules: .*visual.*   # the puzzles are text: no vision adapter
