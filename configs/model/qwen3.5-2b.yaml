# @package _global_
# Qwen3.5-2B, a whole replica on each GPU.
defaults:
  - /family/qwen3.5@_global_

actor_rollout_ref:
  model:
    path: Qwen/Qwen3.5-2B
  rollout:
    # vLLM and training both fit on the GPU, so vLLM never sleeps: its
    # level-1 sleep (verl's, for LoRA) copies its weights to host RAM.
    free_cache_engine: false
