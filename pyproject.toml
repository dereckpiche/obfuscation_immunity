[project]
name = "obfuscation-immunity"
version = "0.1.0"
description = "A judge immune to obfuscation pressure: RL judges of honest-vs-sneaky answer pairs, on verl, in the style of Stable Baselines3."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "verl==0.9.1",
    "torch==2.11.0",
    "transformers==5.9.0",
    "datasets>=3",
    "pyarrow>=19",
    "wandb",
    "cachetools>=7.2.0",
    "uvicorn>=0.54.0",
    "fastapi>=0.136.3",
    "reasoning-gym>=0.1.25",
    # the GPU stack, on Linux only, so a plain `uv sync` installs it on the clusters
    "verl[vllm]==0.9.1; sys_platform == 'linux'",
    "flash-linear-attention==0.5.2; sys_platform == 'linux'",
    "flash-attn; sys_platform == 'linux'",
    "torchao; sys_platform == 'linux'",
]

[project.entry-points."vllm.general_plugins"]
keep_grouped_rms_norms = "obfuscation_immunity.vllm_plugin:keep_grouped_rms_norms"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv's own Python, in $HOME: the clusters' system Pythons are missing on compute
# nodes (Mila) or build C extensions with mismatched toolchains (Killarney, TamIA)
python-preference = "only-managed"
override-dependencies = ["transformers==5.9.0", "numpy>=2.0.0", "kernels>=0.12.0,<0.13"]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu13torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" }
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.cluv]
job_script_path = "scripts/job.sh"
project_dir = "$SCRATCH/obfuscation_immunity"
results_path = "$SCRATCH/logs/obfuscation_immunity"
results_symlink = "logs"

[tool.cluv.env]
UV_OFFLINE = "1"
HF_HUB_OFFLINE = "1"
WANDB_MODE = "online"

[tool.cluv.sbatch_args]
requeue = true

[tool.cluv.clusters.mila]
sbatch_args = { partition = "long", gpus = "l40s:2", cpus-per-gpu = 12, mem-per-gpu = "250G" }

[tool.cluv.clusters.killarney]
sbatch_args = { account = "aip-courvill", gpus = "l40s:2", cpus-per-gpu = 16, mem-per-gpu = "125G" }

[tool.cluv.clusters.fir]
sbatch_args = { account = "rrg-bengioy-ad", gpus = "h100:1", cpus-per-gpu = 12, mem-per-gpu = "280G" }

[tool.cluv.clusters.rorqual]
env = { WANDB_MODE = "offline" }
sbatch_args = { account = "rrg-bengioy-ad", gpus = "h100:1", cpus-per-gpu = 16, mem-per-gpu = "124G" }

[tool.cluv.clusters.nibi]
sbatch_args = { account = "rrg-bengioy-ad", gpus = "h100:1", cpus-per-gpu = 14, mem-per-gpu = "250G" }

[tool.cluv.clusters.trillium-gpu]
env = { WANDB_MODE = "offline" }
sbatch_args = { account = "rrg-bengioy-ad", gpus-per-node = 1 }

[tool.cluv.clusters.tamia]
env = { WANDB_MODE = "offline" }
sbatch_args = { account = "aip-courvill", gpus = "h100:4", cpus-per-gpu = 12, mem-per-gpu = "120G" }
